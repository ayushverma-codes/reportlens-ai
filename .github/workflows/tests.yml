name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test without Groq calls
        run: python -m pytest -q
      - name: Verify deployable index and source files
        run: python -m scripts.phase9_preflight
